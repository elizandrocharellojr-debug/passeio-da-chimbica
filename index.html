<title>Passeio da Chimbica</title>
<style>
  :root{
    --ground:#fbf1e6;
    --ground-2:#f3e2cf;
    --ink:#3a2a1e;
    --ink-soft:#8a6f57;
    --accent:#c9678a;
    --accent-2:#e79a4b;
    --panel:#fffaf3;
    --panel-border:#e8d3b8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#211427;
      --ground-2:#170e1c;
      --ink:#f4e9e0;
      --ink-soft:#c9a9c8;
      --accent:#f0a8c4;
      --accent-2:#f6b56a;
      --panel:#2c1b34;
      --panel-border:#4a2f52;
    }
  }
  :root[data-theme="dark"]{
    --ground:#211427;
    --ground-2:#170e1c;
    --ink:#f4e9e0;
    --ink-soft:#c9a9c8;
    --accent:#f0a8c4;
    --accent-2:#f6b56a;
    --panel:#2c1b34;
    --panel-border:#4a2f52;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, var(--ground-2) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, var(--ground-2) 0%, transparent 55%),
      var(--ground);
    color:var(--ink);
    font-family:'Baloo 2', 'Quicksand', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    padding:18px 12px 28px;
    overflow-x:hidden;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    text-align:center;
  }
  .brand h1{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(13px, 3.6vw, 18px);
    letter-spacing:1px;
    margin:0;
    color:var(--ink);
    text-wrap:balance;
  }
  .brand span{
    font-size:20px;
  }

  .stage-frame{
    position:relative;
    width:min(92vw, 380px);
    aspect-ratio:9/16;
    border-radius:26px;
    padding:10px;
    background:linear-gradient(160deg, var(--panel), var(--ground-2));
    border:1px solid var(--panel-border);
    box-shadow:0 18px 40px -18px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    border-radius:18px;
    overflow:hidden;
    background:#0d0714;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:auto;
    touch-action:none;
  }

  .dpad{
    position:absolute;
    left:14px;
    bottom:14px;
    width:118px;
    height:118px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:4px;
    opacity:0.88;
    z-index:5;
  }
  .dbtn{
    background:rgba(20,12,24,0.42);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:10px;
    color:#fff;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-user-select:none;
    user-select:none;
    backdrop-filter:blur(1px);
  }
  .dbtn:active, .dbtn.active{
    background:rgba(255,255,255,0.32);
  }
  .dbtn.up{grid-column:2; grid-row:1;}
  .dbtn.left{grid-column:1; grid-row:2;}
  .dbtn.right{grid-column:3; grid-row:2;}
  .dbtn.down{grid-column:2; grid-row:3;}
  .dbtn.mid{grid-column:2; grid-row:2; background:transparent; border:none;}

  .hint{
    font-family:'Quicksand', sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    max-width:340px;
    line-height:1.5;
  }
  .hint b{ color:var(--ink); }

  footer.credit{
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.7;
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700&family=Quicksand:wght@500;600&display=swap">

<div class="brand"><span>🍫</span><h1>PASSEIO DA CHIMBICA</h1><span>🐾</span></div>

<div class="stage-frame">
  <div class="screen">
    <canvas id="game" width="360" height="640" aria-label="Jogo: passeio da Chimbica coletando chocolates com o gato e o Shih Tzu"></canvas>
    <div class="dpad" id="dpad">
      <div class="dbtn up" data-dir="up">▲</div>
      <div class="dbtn left" data-dir="left">◀</div>
      <div class="dbtn mid"></div>
      <div class="dbtn right" data-dir="right">▶</div>
      <div class="dbtn down" data-dir="down">▼</div>
    </div>
  </div>
</div>

<p class="hint"><b>Setas / WASD</b> ou o <b>direcional na tela</b> para andar. Ande pelo parque e junte todos os chocolates — seu gato e o Shih Tzu te seguem pelo caminho.</p>
<footer class="credit">um joguinho de pixels · toque na tela para começar</footer>

  function fitCanvas(){
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
    canvas.width = Math.round(LW * dpr);
    canvas.height = Math.round(LH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  // ---------- layout bands ----------
  const SKY_BOTTOM = 190;
  const TREE_Y = 168;
  const PATH_TOP = 190;
  const PATH_BOTTOM = 432;
  const PLAZA_TOP = 432;
  const PLAZA_BOTTOM = 560;
  const HUD_TOP = 560;

  const BOUNDS = { minX: 26, maxX: LW - 26, minY: PATH_TOP + 44, maxY: PLAZA_BOTTOM - 26 };

  // ---------- levels ----------
  const LEVELS = [
    { label:'Tarde', target:9,  sky:['#bfe6f5','#eef9ff'], path:'#ddc79c', pathLine:'#fbead0', plaza:'#c98a72', plazaMortar:'#a86a55', tree:'#4f8f5b', treeDark:'#3c7247', stars:false, lamp:false },
    { label:'Entardecer', target:12, sky:['#3c3169','#f4935f'], path:'#e0a469', pathLine:'#ffe3bf', plaza:'#a85450', plazaMortar:'#7e3c3a', tree:'#3f4a6b', treeDark:'#2c3350', stars:false, lamp:true },
    { label:'Noite', target:15, sky:['#0c1130','#2a2358'], path:'#4a4468', pathLine:'#8f89b8', plaza:'#3a2f52', plazaMortar:'#2a2140', tree:'#242545', treeDark:'#181a33', stars:true, lamp:true },
  ];

  // ---------- input ----------
  const keys = { up:false, down:false, left:false, right:false };
  const KEYMAP = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right'
  };
  window.addEventListener('keydown', (e)=>{
    const d = KEYMAP[e.code];
    if(d){ keys[d]=true; e.preventDefault(); onAnyStart(); }
  }, {passive:false});
  window.addEventListener('keyup', (e)=>{
    const d = KEYMAP[e.code];
    if(d){ keys[d]=false; e.preventDefault(); }
  }, {passive:false});

  const dpad = document.getElementById('dpad');
  dpad.querySelectorAll('.dbtn[data-dir]').forEach(btn=>{
    const dir = btn.dataset.dir;
    const press = (ev)=>{ ev.preventDefault(); keys[dir]=true; btn.classList.add('active'); onAnyStart(); };
    const release = (ev)=>{ if(ev) ev.preventDefault(); keys[dir]=false; btn.classList.remove('active'); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  canvas.addEventListener('pointerdown', ()=>{ onAnyStart(); });

  // ---------- game state ----------
  let state = 'title'; // title | play | levelComplete | win
  let levelIndex = 0;
  let chocolates = [];
  let collected = 0;
  let transitionTimer = 0;

  const player = { x: LW/2, y: (BOUNDS.minY+BOUNDS.maxY)/2, facing:1, moving:false, bob:0 };
  const trail = [];
  const CAT_DELAY = 14;
  const DOG_DELAY = 30;
  const MAX_TRAIL = 200;

  function resetTrail(){
    trail.length = 0;
    for(let i=0;i<MAX_TRAIL;i++) trail.push({x:player.x, y:player.y});
  }
  resetTrail();

  function rand(min,max){ return min + Math.random()*(max-min); }

  function spawnChocolates(n){
    chocolates = [];
    let tries = 0;
    while(chocolates.length < n && tries < 800){
      tries++;
      const x = rand(BOUNDS.minX+10, BOUNDS.maxX-10);
      const y = rand(BOUNDS.minY+10, BOUNDS.maxY-10);
      let ok = true;
      for(const c of chocolates){
        if(Math.hypot(c.x-x, c.y-y) < 34){ ok=false; break; }
      }
      if(ok) chocolates.push({x,y,taken:false,wob:Math.random()*Math.PI*2});
    }
  }

  function startLevel(i){
    levelIndex = i;
    collected = 0;
    spawnChocolates(LEVELS[i].target);
    player.x = LW/2; player.y = (BOUNDS.minY+BOUNDS.maxY)/2;
    resetTrail();
  }

  function onAnyStart(){
    if(state === 'title'){ state='play'; startLevel(0); }
    else if(state === 'levelComplete'){
      if(levelIndex+1 < LEVELS.length){ state='play'; startLevel(levelIndex+1); }
      else { state='win'; }
    }
    else if(state === 'win'){ state='play'; startLevel(0); }
  }

  // ---------- update ----------
  let lastT = performance.now();
  function update(dt){
    if(state !== 'play') return;

    let vx=0, vy=0;
    if(keys.left) vx-=1;
    if(keys.right) vx+=1;
    if(keys.up) vy-=1;
    if(keys.down) vy+=1;
    const moving = (vx!==0 || vy!==0);
    if(moving){
      const len = Math.hypot(vx,vy) || 1;
      vx/=len; vy/=len;
      const speed = 108; // px/sec
      player.x = Math.min(BOUNDS.maxX, Math.max(BOUNDS.minX, player.x + vx*speed*dt));
      player.y = Math.min(BOUNDS.maxY, Math.max(BOUNDS.minY, player.y + vy*speed*dt));
      if(vx !== 0) player.facing = vx > 0 ? 1 : -1;
      player.bob += dt*10;
    } else {
      player.bob += dt*3;
    }
    player.moving = moving;

    trail.push({x:player.x, y:player.y});
    if(trail.length > MAX_TRAIL) trail.shift();

    for(const c of chocolates){
      if(c.taken) continue;
      c.wob += dt*2.4;
      if(Math.hypot(c.x-player.x, c.y-player.y) < 22){
        c.taken = true;
        collected++;
      }
    }

    if(collected >= LEVELS[levelIndex].target){
      state = 'levelComplete';
    }
  }

  function trailPos(delay){
    const idx = Math.max(0, trail.length - 1 - delay);
    return trail[idx] || trail[0];
  }

  // ---------- drawing helpers ----------
  function rr(x,y,w,h,r){
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
    else ctx.rect(x,y,w,h);
  }
  function ellipse(cx,cy,rx,ry){
    ctx.beginPath();
    ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  }

  function drawShadow(x,y,w){
    ctx.fillStyle = 'rgba(20,10,10,0.22)';
    ellipse(x, y+2, w, w*0.34);
    ctx.fill();
  }

  // ----- Chimbica (player) -----
  function drawPlayer(x,y,facing,bob,moving){
    const bobY = moving ? Math.sin(bob)*2.2 : Math.sin(bob)*0.6;
    drawShadow(x, y+2, 12);
    ctx.save();
    ctx.translate(x, y - 30 + bobY);
    ctx.scale(facing, 1);

    // legs
    ctx.fillStyle = '#4a5b8c';
    rr(-8,20,7,12,3); ctx.fill();
    rr(1,20,7,12,3); ctx.fill();
    ctx.fillStyle = '#ffffff';
    rr(-9,29,9,5,2); ctx.fill();
    rr(0,29,9,5,2); ctx.fill();

    // arms
    ctx.fillStyle = '#f4c9a0';
    ellipse(-11,7,4.6,6.5); ctx.fill();
    ellipse(11,7,4.6,6.5); ctx.fill();

    // strapless top (coral/orange)
    ctx.fillStyle = '#ec6a3f';
    rr(-11,1,22,21,8); ctx.fill();
    ctx.fillStyle = '#d55a34';
    rr(-11,14,22,8,6); ctx.fill();
    ctx.fillStyle = '#f3805a';
    rr(-11,1,22,4,3); ctx.fill();

    // thin gold necklace
    ctx.strokeStyle = '#e0b357'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-6,-1); ctx.quadraticCurveTo(0,3,6,-1); ctx.stroke();

    // hair back (dirty blonde, falling past shoulders) — drawn behind the face
    ctx.fillStyle = '#a9814f';
    ellipse(0,-17,15.5,15); ctx.fill();
    ellipse(-10,2,3.8,11); ctx.fill();
    ellipse(10,2,3.8,11); ctx.fill();

    // head — her real photo, clipped into a bigger circle (painted over the hair-back blob)
    if(faceLoaded){
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0,-15,13.5,13.5,0,0,Math.PI*2); ctx.clip();
      ctx.drawImage(FACE_IMG, -13.5,-28.5,27,27);
      ctx.restore();
    } else {
      ctx.fillStyle = '#f4c9a0';
      ellipse(0,-15,13.5,13.5); ctx.fill();
    }

    // side hair framing the face (kept to the outer edge, off the cheeks)
    ctx.fillStyle = '#b58e57';
    ellipse(-14.2,-10,2.7,7.5); ctx.fill();
    ellipse(14.2,-10,2.7,7.5); ctx.fill();

    // bangs — a slim fringe along the hairline only, brows and eyes stay clear
    ctx.fillStyle = '#b58e57';
    rr(-13.5,-29,27,6,7); ctx.fill();
    ctx.fillStyle = '#f4c9a0';
    ctx.beginPath(); ctx.moveTo(-1.7,-29); ctx.lineTo(1.7,-29); ctx.lineTo(0,-22.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a9814f';
    rr(-13.5,-29,27,2.8,3); ctx.fill();

    ctx.restore();
  }

  // ----- cat -----
  function drawCat(x,y,facing,bob,moving){
    const bobY = moving ? Math.sin(bob+1)*1.6 : Math.sin(bob)*0.5;
    drawShadow(x,y+1,9);
    if(catLoaded){
      const W = 24, H = W * (CAT_IMG.naturalHeight / CAT_IMG.naturalWidth);
      ctx.save();
      ctx.translate(x, y - H + 8 + bobY);
      ctx.scale(facing,1);
      ctx.drawImage(CAT_IMG, -W/2, 0, W, H);
      ctx.restore();
    } else {
      drawCatVector(x,y,facing,bobY);
    }
  }

  function drawCatVector(x,y,facing,bobY){
    ctx.save();
    ctx.translate(x, y - 10 + bobY);
    ctx.scale(facing,1);

    // tail
    ctx.strokeStyle = '#f4efe4';
    ctx.lineWidth = 4.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(8,2);
    ctx.quadraticCurveTo(17,0,15,-10);
    ctx.stroke();
    ctx.strokeStyle = '#e08a3c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(16,-9); ctx.lineTo(14.5,-12);
    ctx.stroke();

    // body
    ctx.fillStyle = '#f9f4e8';
    ellipse(0,0,11,7.5); ctx.fill();
    // patch
    ctx.fillStyle = '#e08a3c';
    ellipse(-4,-2,5,4); ctx.fill();

    // head
    ctx.fillStyle = '#f9f4e8';
    ellipse(9,-7,6.4,6); ctx.fill();
    // ears
    ctx.beginPath();
    ctx.moveTo(5.5,-11); ctx.lineTo(4,-16); ctx.lineTo(8.5,-12.5); ctx.closePath();
    ctx.fillStyle = '#f9f4e8'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(11,-12); ctx.lineTo(13,-17); ctx.lineTo(14.5,-11.5); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e2a06a';
    ctx.beginPath(); ctx.moveTo(11.6,-12.4); ctx.lineTo(13,-15.6); ctx.lineTo(13.8,-11.9); ctx.closePath(); ctx.fill();

    // orange ear patch
    ctx.fillStyle = '#e08a3c';
    ellipse(11,-9,3,3); ctx.fill();

    // face
    ctx.fillStyle = '#241a12';
    ellipse(7,-7,1,1.3); ctx.fill();
    ellipse(11.5,-7,1,1.3); ctx.fill();
    ctx.fillStyle = '#d97a8a';
    ctx.beginPath(); ctx.moveTo(9,-5); ctx.lineTo(10.4,-5); ctx.lineTo(9.7,-4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(60,40,25,0.5)'; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(5,-5.5); ctx.lineTo(-1,-5.8); ctx.moveTo(5,-4.4); ctx.lineTo(-1,-3.6); ctx.stroke();

    // legs
    ctx.fillStyle = '#f9f4e8';
    rr(-7,5,3.6,5,1.6); ctx.fill();
    rr(3,5,3.6,5,1.6); ctx.fill();

    ctx.restore();
  }

  // ----- shih tzu dog (black & white) -----
  function drawDog(x,y,facing,bob,moving){
    const bobY = moving ? Math.sin(bob+2)*1.7 : Math.sin(bob)*0.5;
    drawShadow(x,y+3,12);
    if(dogLoaded){
      const W = 32, H = W * (DOG_IMG.naturalHeight / DOG_IMG.naturalWidth);
      ctx.save();
      ctx.translate(x, y - H + 9 + bobY);
      ctx.scale(facing,1);
      ctx.drawImage(DOG_IMG, -W/2, 0, W, H);
      ctx.restore();
    } else {
      drawDogVector(x,y,facing,bobY);
    }
  }

  function drawDogVector(x,y,facing,bobY){
    ctx.save();
    ctx.translate(x, y - 13 + bobY);
    ctx.scale(facing,1);

    // tail (fluffy pom, held over back, drawn clear of the body outline)
    ctx.fillStyle = '#f7f7f5';
    ellipse(-11,-13,4.6,4.6); ctx.fill();
    ctx.fillStyle = '#28262c';
    ellipse(-12,-15.5,2,2); ctx.fill();

    // back legs (peeking out behind body)
    ctx.fillStyle = '#eae4dc';
    rr(-9,3,4,6,2); ctx.fill();
    rr(2,3.5,4,6,2); ctx.fill();

    // body (fluffy, single clean silhouette)
    ctx.fillStyle = '#f9f9f6';
    ellipse(-2,-2,12.5,9); ctx.fill();
    // soft fur puffs along the back only (kept away from the head)
    ellipse(-9,-6,3.6,3.4); ctx.fill();
    ellipse(-1,-9,3.6,3.2); ctx.fill();

    // front legs
    ctx.fillStyle = '#f2f2ee';
    rr(-6,4.5,4,6,2); ctx.fill();
    rr(6,4.5,4,6,2); ctx.fill();

    // ears — floppy, drawn BEHIND the head so they read as hanging beside it
    ctx.fillStyle = '#26242a';
    ellipse(7.5,-14.5,3.6,6); ctx.fill();
    ctx.fillStyle = '#312e34';
    ellipse(18,-13.5,3.6,5.8); ctx.fill();

    // head (white, offset forward/up from the body)
    ctx.fillStyle = '#f9f9f6';
    ellipse(12.5,-11,8.4,7.6); ctx.fill();

    // black patch over ONE eye only — classic shih tzu split face, kept small
    ctx.fillStyle = '#28262c';
    ctx.beginPath();
    ctx.ellipse(8,-13,3.6,4.4,-0.2,0,Math.PI*2);
    ctx.fill();

    // muzzle / snout, pushed forward so the flat shih-tzu face reads clearly
    ctx.fillStyle = '#fdfcfa';
    ellipse(17.5,-8.5,5.2,4.4); ctx.fill();
    ctx.fillStyle = '#1c1a1e';
    ellipse(20.6,-9,1.7,1.4); ctx.fill();
    ctx.strokeStyle = '#1c1a1e'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(17.5,-6.6); ctx.lineTo(17.5,-5.4); ctx.stroke();
    ctx.fillStyle = '#e8879a';
    ellipse(17.5,-4.6,1.4,1); ctx.fill();

    // eyes — light ring first so they stay visible even over the black patch
    ctx.fillStyle = '#faf3ea';
    ellipse(8.4,-13.2,1.7,1.7); ctx.fill();
    ellipse(14.6,-12.2,1.7,1.7); ctx.fill();
    ctx.fillStyle = '#14110d';
    ellipse(8.6,-13.1,1,1); ctx.fill();
    ellipse(14.8,-12.1,1,1); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ellipse(8.9,-13.5,0.4,0.4); ctx.fill();
    ellipse(15.1,-12.5,0.4,0.4); ctx.fill();

    ctx.restore();
  }

  // ----- decor -----
  function drawTree(x,y,scale,leaf,leafDark){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = 'rgba(20,10,10,0.18)';
    ellipse(0,3,14,4); ctx.fill();
    ctx.fillStyle = '#6b4a30';
    rr(-3,-6,6,14,2); ctx.fill();
    ctx.fillStyle = leafDark;
    ellipse(0,-22,17,15); ctx.fill();
    ctx.fillStyle = leaf;
    ellipse(-4,-25,14,12); ctx.fill();
    ctx.restore();
  }

  function drawBench(x,y){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = 'rgba(20,10,10,0.18)';
    ellipse(0,10,20,4); ctx.fill();
    ctx.fillStyle = '#7a5334';
    rr(-20,-10,6,20,1.5); ctx.fill();
    rr(14,-10,6,20,1.5); ctx.fill();
    ctx.fillStyle = '#96693f';
    rr(-22,-12,44,5,1.5); ctx.fill();
    rr(-22,2,44,5,1.5); ctx.fill();
    ctx.restore();
  }

  function drawLamp(x,y,glow){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = '#2c2a35';
    rr(-2,-38,4,38,2); ctx.fill();
    if(glow){
      ctx.fillStyle = 'rgba(255,224,150,0.28)';
      ellipse(0,-40,16,16); ctx.fill();
    }
    ctx.fillStyle = '#f6d98a';
    ellipse(0,-40,5,5); ctx.fill();
    ctx.strokeStyle = '#2c2a35'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,-40,5,5,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawChoco(x,y,wob){
    const s = 1 + Math.sin(wob)*0.06;
    ctx.save();
    ctx.translate(x, y + Math.sin(wob*1.3)*1.5);
    ctx.scale(s,s);
    ctx.fillStyle = 'rgba(20,10,10,0.2)';
    ellipse(0,7,7,2.4); ctx.fill();
    ctx.fillStyle = '#6b3a1f';
    rr(-6.5,-6.5,13,13,3); ctx.fill();
    ctx.fillStyle = '#8a5027';
    rr(-6.5,-6.5,13,5,2.5); ctx.fill();
    ctx.strokeStyle='#d9a86a'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-4,-2); ctx.lineTo(4,-2); ctx.moveTo(-4,1.5); ctx.lineTo(4,1.5); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    rr(-5,-5.5,3,3,1); ctx.fill();
    ctx.restore();
  }

  // deterministic decor layout (seeded manually so it stays put)
  const TREES = [40,95,150,215,270,325].map((x,i)=>({x, s: i%2===0?1:0.85}));
  const BENCHES = [90, 270];
  const LAMPS = [40, 320];

  function drawScene(){
    const lvl = LEVELS[levelIndex] || LEVELS[0];

    // sky
    const g = ctx.createLinearGradient(0,0,0,SKY_BOTTOM);
    g.addColorStop(0, lvl.sky[0]);
    g.addColorStop(1, lvl.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,LW,SKY_BOTTOM);

    if(lvl.stars){
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      const starSeed = [ [20,20],[60,45],[100,18],[150,55],[190,25],[230,50],[270,15],[310,40],[335,65],[75,75],[210,80] ];
      for(const [sx,sy] of starSeed){ ellipse(sx,sy,1.1,1.1); ctx.fill(); }
    } else {
      // sun/moon-ish soft disc
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ellipse(LW-70, 55, 22, 22); ctx.fill();
    }

    // tree line
    for(const t of TREES) drawTree(t.x, TREE_Y, t.s, lvl.tree, lvl.treeDark);

    // path
    ctx.fillStyle = lvl.path;
    ctx.fillRect(0, PATH_TOP, LW, PATH_BOTTOM-PATH_TOP);
    ctx.strokeStyle = lvl.pathLine;
    ctx.lineWidth = 3;
    ctx.setLineDash([14,10]);
    ctx.beginPath();
    ctx.moveTo(0, (PATH_TOP+PATH_BOTTOM)/2);
    ctx.lineTo(LW, (PATH_TOP+PATH_BOTTOM)/2);
    ctx.stroke();
    ctx.setLineDash([]);

    for(const bx of BENCHES) drawBench(bx, PATH_TOP+22);

    // plaza
    ctx.fillStyle = lvl.plaza;
    ctx.fillRect(0, PLAZA_TOP, LW, PLAZA_BOTTOM-PLAZA_TOP);
    ctx.strokeStyle = lvl.plazaMortar;
    ctx.lineWidth = 1;
    for(let yy=PLAZA_TOP+8; yy<PLAZA_BOTTOM; yy+=14){
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(LW,yy); ctx.stroke();
    }
    let brickRow=0;
    for(let yy=PLAZA_TOP; yy<PLAZA_BOTTOM; yy+=14){
      const off = (brickRow%2===0) ? 0 : 20;
      brickRow++;
      for(let xx=-20+off; xx<LW; xx+=40){
        ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy+14); ctx.stroke();
      }
    }

    for(const lx of LAMPS) drawLamp(lx, PATH_TOP+14, lvl.lamp);
  }

  function drawHUD(){
    ctx.fillStyle = 'rgba(15,8,18,0.82)';
    ctx.fillRect(0, HUD_TOP, LW, LH-HUD_TOP);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.moveTo(0,HUD_TOP); ctx.lineTo(LW,HUD_TOP); ctx.stroke();

    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f7e9d8';
    ctx.font = "12px 'Press Start 2P', monospace";
    ctx.textAlign = 'left';
    ctx.fillText('🍫 ' + collected + '/' + LEVELS[levelIndex].target, 16, HUD_TOP+24);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#e79a4b';
    ctx.fillText(LEVELS[levelIndex].label, LW-16, HUD_TOP+24);

    ctx.textAlign = 'center';
    ctx.font = "10px 'Press Start 2P', monospace";
    ctx.fillStyle = '#e88aa0';
    ctx.fillText('CHIMBICA', LW/2, HUD_TOP+50);

    // progress bar
    const barX=16, barY=HUD_TOP+62, barW=LW-32, barH=8;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    rr(barX,barY,barW,barH,4); ctx.fill();
    const pct = Math.min(1, collected/LEVELS[levelIndex].target);
    ctx.fillStyle = '#e88aa0';
    rr(barX,barY,Math.max(8,barW*pct),barH,4); ctx.fill();
  }

  function panel(title, sub, cta){
    ctx.fillStyle = 'rgba(10,6,14,0.72)';
    ctx.fillRect(0,0,LW,LH);

    ctx.textAlign='center';
    ctx.textBaseline='middle';

    ctx.font = "16px 'Press Start 2P', monospace";
    ctx.fillStyle = '#ffffff';
    wrapText(title, LW/2, LH/2 - 40, 300, 26);

    ctx.font = "13px 'Baloo 2', sans-serif";
    ctx.fillStyle = '#e8d3e6';
    wrapText(sub, LW/2, LH/2 + 26, 280, 20);

    // cta pill
    const cy = LH/2 + 74;
    ctx.fillStyle = '#e88aa0';
    rr(LW/2-90, cy-18, 180, 36, 18); ctx.fill();
    ctx.font = "12px 'Press Start 2P', monospace";
    ctx.fillStyle = '#2a1522';
    ctx.fillText(cta, LW/2, cy+1);
  }

  function wrapText(text, cx, cy, maxW, lh){
    const words = text.split(' ');
    let line = '', lines=[];
    for(const w of words){
      const test = line ? line+' '+w : w;
      if(ctx.measureText(test).width > maxW && line){ lines.push(line); line=w; }
      else line = test;
    }
    lines.push(line);
    const startY = cy - (lines.length-1)*lh/2;
    lines.forEach((l,i)=> ctx.fillText(l, cx, startY + i*lh));
  }

  function draw(){
    drawScene();

    if(state !== 'title'){
      for(const c of chocolates) if(!c.taken) drawChoco(c.x, c.y, c.wob);

      const catP = trailPos(CAT_DELAY);
      const dogP = trailPos(DOG_DELAY);
      const dogFacing = (dogP.x < player.x - 1) ? 1 : (dogP.x > player.x + 1 ? -1 : player.facing);
      const catFacing = (catP.x < player.x - 1) ? 1 : (catP.x > player.x + 1 ? -1 : player.facing);

      // painter order by y
      const items = [
        { y: dogP.y, draw:()=>drawDog(dogP.x, dogP.y, dogFacing, player.bob, player.moving) },
        { y: catP.y, draw:()=>drawCat(catP.x, catP.y, catFacing, player.bob, player.moving) },
        { y: player.y, draw:()=>drawPlayer(player.x, player.y, player.facing, player.bob, player.moving) },
      ];
      items.sort((a,b)=>a.y-b.y);
      for(const it of items) it.draw();

      drawHUD();
    }

    if(state === 'title'){
      panel('PASSEIO DA\nCHIMBICA', 'ande pelo parque e junte\ntodos os chocolates 🍫\nseu gato e o shih tzu vão\nte seguir pelo caminho', 'COMEÇAR');
    } else if(state === 'levelComplete'){
      const isLast = levelIndex+1 >= LEVELS.length;
      panel(isLast ? 'ÚLTIMA FASE\nCONCLUÍDA!' : 'FASE CONCLUÍDA!', isLast ? 'toque para ver o final' : 'preparando a próxima fase...', isLast?'VER FINAL':'CONTINUAR');
    } else if(state === 'win'){
      panel('VOCÊ COMEU\nTODOS OS\nCHOCOLATES! 🍫', 'a chimbica, o tom jobim e a mada agradecem 🐾🤍', 'JOGAR DE NOVO');
    }
  }

  function loop(t){
    const dt = Math.min(0.05, (t - lastT)/1000);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
